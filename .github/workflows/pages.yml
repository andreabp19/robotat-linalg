name: Doxygen Github Pages Deploy Action

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ubuntu-latest
    permissions:
      deployments: write
    
    steps:
      - name: Delete previous deployments
        uses: strumwolf/delete-deployment-environment@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          environment: github-pages
          onlyRemoveDeployments: true

  deploy:
    needs: cleanup

    runs-on: ubuntu-latest

    steps:
      - name: Checkout main (source + doxyfile)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Checkout gh-pages (landing page)
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: site

      - name: Install Graphviz
        run: |
          sudo apt-get update
          sudo apt-get install -y graphviz

      - name: Install Doxygen
        env:
          DOXYGEN_VERSION: 1.16.1
        run: |
          wget -q "https://github.com/doxygen/doxygen/releases/download/Release_${DOXYGEN_VERSION//./_}/doxygen-${DOXYGEN_VERSION}.linux.bin.tar.gz"
          tar -xzf "doxygen-${DOXYGEN_VERSION}.linux.bin.tar.gz"
          echo "$PWD/doxygen-${DOXYGEN_VERSION}/bin" >> "$GITHUB_PATH"

      - name: Fetch Doxygen Awesome theme
        uses: actions/checkout@v4
        with:
          repository: jothepro/doxygen-awesome-css
          ref: v2.5.0
          path: doxygen-awesome-css

      - name: Generate Doxygen Documentation
        run: doxygen Doxyfile

      - name: Assemble site
        run: |
          mkdir -p public
          cp -r site/. public/
          mkdir -p public/docs
          cp -r docs/. public/docs/
          touch public/.nojekyll

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./public

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v5